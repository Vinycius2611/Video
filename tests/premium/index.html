<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinycius Moraes | Laboratório de qualidade HyperFrames</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#06111d;color:#fff;font-family:Inter,Arial,sans-serif}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#071425;isolation:isolate}
.back{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 38%,#274458 0%,#0c2335 40%,#07111f 80%)}
.grain{position:absolute;inset:0;opacity:.21;background-image:repeating-linear-gradient(0deg,transparent 0px,transparent 8px,#d1bf9b10 9px,#0000 10px)}
.halo{position:absolute;left:160px;top:500px;width:760px;height:730px;border-radius:50%;background:radial-gradient(circle,#c8ac6c42,#ffffff00 67%);filter:blur(18px)}
.rule-top{position:absolute;left:90px;right:90px;top:187px;height:2px;background:linear-gradient(90deg,transparent,#d8bc92,transparent)}
.title-clip{position:absolute;top:225px;left:100px;right:100px;text-align:center}
.eyebrow{color:#dac19b;font-size:27px;font-weight:700;letter-spacing:9px}
.headline{font-size:86px;line-height:.99;letter-spacing:-3px;font-weight:900;margin-top:37px;text-shadow:0 14px 36px #0009}
.sub{font-size:32px;color:#d6dce4;letter-spacing:5px;margin-top:27px}
.world{position:absolute;left:55px;top:560px;width:970px;height:750px;perspective:1500px;perspective-origin:50% 44%}
.floor{position:absolute;left:140px;top:365px;width:680px;height:560px;transform:rotateX(72deg);background:repeating-linear-gradient(0deg,#d8bc9221 0px,#d8bc9221 2px,transparent 3px,transparent 56px),repeating-linear-gradient(90deg,#d8bc9221 0px,#d8bc9221 2px,transparent 3px,transparent 56px),radial-gradient(ellipse at center,#31576a90,transparent 70%);border:2px solid #d8bc9233}
.mesh{position:absolute;left:190px;top:120px;width:590px;height:385px;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:visible;border:3px solid #c1ad8b55}
.front{width:590px;height:385px;transform:translateZ(132px);background:linear-gradient(155deg,#e4d5b7 0%,#b7ab94 50%,#74838a 100%);box-shadow:0 14px 65px #0007}
.backface{width:590px;height:385px;transform:rotateY(180deg) translateZ(132px);background:#607080}
.side{width:264px;height:385px;left:163px;transform:rotateY(90deg) translateZ(295px);background:linear-gradient(155deg,#6b7d8e,#273f54)}
.side-left{width:264px;height:385px;left:163px;transform:rotateY(-90deg) translateZ(295px);background:#77899b}
.roof{width:590px;height:264px;top:60px;transform:rotateX(90deg) translateZ(192px);background:linear-gradient(90deg,#d8bc92,#fff5d6 50%,#8d8877);box-shadow:0 0 30px #f9edc4a0}
.door{position:absolute;left:238px;bottom:0;width:130px;height:225px;border:7px solid #ad9471;background:linear-gradient(90deg,#293e4e,#172333)}
.glass{position:absolute;left:40px;top:95px;width:148px;height:190px;border:8px solid #4f6774;background:linear-gradient(130deg,#9dd7d888,#243c5b88);box-shadow:inset 5px 0 15px #07142566}
.glass-right{left:399px;width:138px}
.door-handle{position:absolute;right:8px;top:127px;width:8px;height:28px;background:#d8bc92}
.pool{position:absolute;left:172px;top:520px;width:675px;height:210px;transform:rotateX(67deg);border:17px solid #d3b78a;background:linear-gradient(110deg,#13a6c8,#2dd2ce 50%,#0d7ca7);box-shadow:0 30px 70px #0ad1da5c}
.poolmark{position:absolute;left:10px;right:10px;top:55px;height:5px;background:#ddffff5c;box-shadow:0 24px #b1fff969,0 45px #b1fff93b}
.light{position:absolute;left:-370px;top:520px;width:390px;height:580px;transform:rotate(23deg);background:linear-gradient(90deg,transparent,#ffffff33,transparent);filter:blur(18px);mix-blend-mode:screen}
.offer{position:absolute;left:95px;right:95px;top:1310px;text-align:center}
.stripe{width:180px;height:6px;margin:0 auto 35px;background:#d8bc92}
.value{font-weight:900;font-size:114px;letter-spacing:-3px;color:#f0d5a9;text-shadow:0 8px 25px #0008}
.month{font-size:27px;letter-spacing:8px;color:#fff}
.tagline{position:absolute;top:1540px;left:100px;right:100px;text-align:center;color:#d8bc92;font-size:31px;letter-spacing:7px}
.bottom{position:absolute;bottom:180px;left:130px;right:130px;text-align:center;color:#a8bbc9;font-size:21px;letter-spacing:2px}
.borders{position:absolute;inset:48px;border:2px solid #cbb08c28;pointer-events:none}
</style>
</head>
<body>
<div id="root" data-composition-id="premium" data-start="0" data-duration="5" data-width="1080" data-height="1920" data-fps="30">
  <div class="back"></div><div class="grain"></div><div class="halo"></div><div class="rule-top"></div><div class="borders"></div>
  <div id="titleclip" class="clip title-clip" data-start="0" data-duration="5" data-track-index="2">
    <div id="titlecopy"><div class="eyebrow">CONCEITO IMOBILIÁRIO</div><div class="headline">CINEMA<br>EM 3D</div><div class="sub">MOTION • LUZ • PROFUNDIDADE</div></div>
  </div>
  <div id="worldclip" class="clip world" data-start="0" data-duration="5" data-track-index="1">
    <div class="floor"></div>
    <div id="mesh" class="mesh">
       <div class="face front"><div class="door"><div class="door-handle"></div></div><div class="glass"></div><div class="glass glass-right"></div></div>
       <div class="face backface"></div><div class="face side"></div><div class="face side-left"></div><div class="face roof"></div>
    </div>
    <div id="pool" class="pool"><div class="poolmark"></div></div>
  </div>
  <div id="lightclip" class="clip" data-start="0" data-duration="5" data-track-index="2"><div id="light" class="light"></div></div>
  <div id="offerclip" class="clip offer" data-start="0.6" data-duration="4.4" data-track-index="3"><div id="offercopy"><div class="stripe"></div><div class="value">R$ 3.000</div><div class="month">POR MÊS</div></div></div>
  <div id="brandclip" class="clip tagline" data-start="1.2" data-duration="3.8" data-track-index="4"><div id="brandcopy">VINYCIUS MORAES</div></div>
  <div class="bottom">CENÁRIO 3D FICTÍCIO · TESTE DE QUALIDADE</div>
  <audio id="audioteste" class="clip" data-start="0" data-duration="5" data-track-index="5" data-volume="0.38" src="assets/probe.wav"></audio>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo("#mesh",{rotationY:-42,rotationX:-12,z:-140},{rotationY:24,rotationX:-8,z:50,duration:4.95,ease:"power2.inOut"},0);
tl.fromTo("#pool",{opacity:.2,scale:.8},{opacity:1,scale:1,duration:2.5,ease:"power2.out"},.2);
tl.fromTo("#titlecopy",{opacity:0,y:110},{opacity:1,y:0,duration:1.15,ease:"power4.out"},0);
tl.fromTo("#offercopy",{opacity:0,y:120,scale:.85},{opacity:1,y:0,scale:1,duration:1.25,ease:"power4.out"},.6);
tl.fromTo("#brandcopy",{opacity:0,y:45},{opacity:1,y:0,duration:1.1,ease:"power3.out"},1.2);
tl.fromTo("#light",{x:-450,opacity:0},{x:1900,opacity:.8,duration:4.8,ease:"power1.inOut"},0.1);
window.__timelines.premium=tl;
</script>
</body>
</html>
